# Read about fixtures at https://api.rubyonrails.org/classes/ActiveRecord/FixtureSet.html
#
# NOTE: the previous `one: {}` / `two: {}` rows violated the unique index on
# users.email (both rows fell back to the column default ""). Fixtures bypass
# model callbacks, so these users have NO avatar/voice_enrollment rows —
# tests that need the full User.create! side effects should create users
# directly (see test/support/audio_test_helpers.rb).

one:
  email: fixture-one@example.com
  encrypted_password: <%= Devise::Encryptor.digest(User, "password123") %>
  role: user
  timezone: UTC

two:
  email: fixture-two@example.com
  encrypted_password: <%= Devise::Encryptor.digest(User, "password123") %>
  role: administrator
  timezone: UTC
