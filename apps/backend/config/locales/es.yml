es:
  date:
    abbr_day_names: [dom, lun, mar, mié, jue, vie, sáb]
    abbr_month_names: [~, ene, feb, mar, abr, may, jun, jul, ago, sep, oct, nov, dic]
    day_names: [domingo, lunes, martes, miércoles, jueves, viernes, sábado]
    formats:
      default: "%d/%m/%Y"
      long: "%-d de %B de %Y"
      short: "%-d de %b"
    month_names: [~, enero, febrero, marzo, abril, mayo, junio, julio, agosto, septiembre, octubre, noviembre, diciembre]
    order: [day, month, year]

  datetime:
    distance_in_words:
      half_a_minute: "medio minuto"
      less_than_x_seconds:
        one: "menos de 1 segundo"
        other: "menos de %{count} segundos"
      x_seconds:
        one: "1 segundo"
        other: "%{count} segundos"
      less_than_x_minutes:
        one: "menos de 1 minuto"
        other: "menos de %{count} minutos"
      x_minutes:
        one: "1 minuto"
        other: "%{count} minutos"
      about_x_hours:
        one: "alrededor de 1 hora"
        other: "alrededor de %{count} horas"
      x_hours:
        one: "1 hora"
        other: "%{count} horas"
      x_days:
        one: "1 día"
        other: "%{count} días"
      about_x_months:
        one: "alrededor de 1 mes"
        other: "alrededor de %{count} meses"
      x_months:
        one: "1 mes"
        other: "%{count} meses"
      about_x_years:
        one: "alrededor de 1 año"
        other: "alrededor de %{count} años"
      over_x_years:
        one: "más de 1 año"
        other: "más de %{count} años"
      almost_x_years:
        one: "casi 1 año"
        other: "casi %{count} años"
    prompts:
      second: "Segundos"
      minute: "Minutos"
      hour: "Horas"
      day: "Día"
      month: "Mes"
      year: "Año"

  time:
    am: "am"
    pm: "pm"
    formats:
      default: "%a, %-d de %b de %Y a las %H:%M:%S"
      long: "%-d de %B de %Y %H:%M"
      short: "%-d de %b %H:%M"

  number:
    format:
      delimiter: "."
      precision: 3
      separator: ","
    currency:
      format:
        delimiter: "."
        format: "%n %u"
        precision: 2
        separator: ","
        unit: "€"
    human:
      format:
        delimiter: "."
        precision: 2
        separator: ","
      storage_units:
        format: "%n %u"
        units:
          byte:
            one: "Byte"
            other: "Bytes"
          kb: "KB"
          mb: "MB"
          gb: "GB"
          tb: "TB"
    percentage:
      format:
        delimiter: ""
        format: "%n%"
    precision:
      format:
        delimiter: ""

  support:
    array:
      last_word_connector: " y "
      two_words_connector: " y "
      words_connector: ", "

  errors:
    format: "%{attribute} %{message}"
    messages:
      accepted: "debe ser aceptado"
      blank: "no puede estar en blanco"
      confirmation: "no coincide con %{attribute}"
      empty: "no puede estar vacío"
      equal_to: "debe ser igual a %{count}"
      even: "debe ser par"
      exclusion: "está reservado"
      greater_than: "debe ser mayor que %{count}"
      greater_than_or_equal_to: "debe ser mayor o igual a %{count}"
      inclusion: "no está incluido en la lista"
      invalid: "no es válido"
      less_than: "debe ser menor que %{count}"
      less_than_or_equal_to: "debe ser menor o igual a %{count}"
      not_a_number: "no es un número"
      not_an_integer: "debe ser un entero"
      odd: "debe ser impar"
      other_than: "debe ser distinto de %{count}"
      present: "debe estar en blanco"
      required: "debe existir"
      taken: "ya está en uso"
      too_long:
        one: "es demasiado largo (1 carácter máximo)"
        other: "es demasiado largo (%{count} caracteres máximo)"
      too_short:
        one: "es demasiado corto (1 carácter mínimo)"
        other: "es demasiado corto (%{count} caracteres mínimo)"
      wrong_length:
        one: "tiene una longitud errónea (debe ser de 1 carácter)"
        other: "tiene una longitud errónea (debe ser de %{count} caracteres)"
    template:
      body: "Se han encontrado problemas con los siguientes campos:"
      header:
        one: "1 error ha impedido que este %{model} se guarde"
        other: "%{count} errores han impedido que este %{model} se guarde"
